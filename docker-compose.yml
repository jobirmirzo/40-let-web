services:
  frontend:
    image: ghcr.io/jobirmirzo/40-let-frontend:latest
    restart: unless-stopped
    ports:
      - "5173:80"          # host:container — nginx listens on 80 in the container
    environment:
      BACKEND_UPSTREAM: backend:8080   # container name:port of the 40-let backend service

networks:
  default:
    name: 40let-network
    external: true
